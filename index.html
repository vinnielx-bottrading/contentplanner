<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafka X · Content Planner</title>
<style>
  :root{
    --bg:#f4f6f9;
    --panel:#ffffff;
    --border:#e3e7ee;
    --text:#1f2430;
    --muted:#7a8194;
    --accent:#c0662b;
    --accent-dark:#954d1d;
    --radius:12px;
    --shadow:0 1px 3px rgba(20,25,40,.06),0 1px 2px rgba(20,25,40,.04);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    position:sticky;
    top:0;
    z-index:20;
  }
  header h1{
    font-size:19px;
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header h1 span.dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,#e0954f,#b5651d);
    display:inline-block;
  }
  .kafkax-brand{
    color:#b5651d;
    font-weight:800;
    letter-spacing:.03em;
    animation:kafkaxGlow 2s ease-in-out infinite;
  }
  @keyframes kafkaxGlow{
    0%,100%{ text-shadow:0 0 2px rgba(181,101,29,.25),0 0 6px rgba(181,101,29,.2); }
    50%{ text-shadow:0 0 8px rgba(181,101,29,.9),0 0 20px rgba(181,101,29,.65),0 0 32px rgba(181,101,29,.35); }
  }
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type=text], select{
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    background:#fff;
    color:var(--text);
    outline:none;
  }
  input[type=text]:focus, select:focus{border-color:var(--accent);}
  button{
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:#eef1f7;color:var(--text);}
  .btn-ghost:hover{background:#e2e6ee;}
  .btn-danger{background:#fdeceb;color:#d64545;}
  .btn-danger:hover{background:#fadbd9;}
  .btn-approve{background:#34a853;color:#fff;}
  .btn-approve:hover{background:#2c8c46;}

  main{padding:20px 24px 60px;}
  .grid-count{
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    margin-bottom:10px;
  }
  .content-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
    align-items:start;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    box-shadow:var(--shadow);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  /* Content đã "Phê duyệt": nền xanh mint để nổi bật, dễ nhận ra ngay trong lưới. */
  .card.card-approved{
    background:#e3faf0;
    border-color:#a9ecce;
  }
  /* Content CHƯA được phê duyệt (Đang thực hiện / Đang xem xét): phát sáng cam mỗi 2 giây để nhắc admin vào duyệt. */
  /* Field Deadline đã ẩn khỏi form — ẩn luôn khung/nút lịch mà JS tự bọc quanh input để không còn icon 📅 mồ côi */
  .date-field-wrap:has(#fDeadline){
    display:none !important;
  }
  .card.card-needs-approval{
    animation: cardNeedsApprovalGlow 2s ease-in-out infinite;
  }
  @keyframes cardNeedsApprovalGlow{
    0%,100%{
      box-shadow:0 1px 3px rgba(20,25,40,.06),0 1px 2px rgba(20,25,40,.04);
      border-color:var(--border);
    }
    50%{
      box-shadow:0 0 0 2px rgba(255,159,10,.55),0 0 18px 4px rgba(255,159,10,.45);
      border-color:#ff9f0a;
    }
  }
  /* Content bị Admin yêu cầu chỉnh sửa (có feedback chưa xử lý): phát sáng ĐỎ để nổi bật hơn hẳn "cần xem xét" thường. */
  .card.card-has-feedback{
    animation: cardFeedbackGlow 2s ease-in-out infinite;
  }
  @keyframes cardFeedbackGlow{
    0%,100%{
      box-shadow:0 1px 3px rgba(20,25,40,.06),0 1px 2px rgba(20,25,40,.04);
      border-color:var(--border);
    }
    50%{
      box-shadow:0 0 0 2px rgba(214,69,69,.55),0 0 18px 4px rgba(214,69,69,.45);
      border-color:#d64545;
    }
  }
  .feedback-banner{
    background:#fdeceb;
    border:1px solid #f3b9b4;
    border-radius:10px;
    padding:10px 12px;
    font-size:12.5px;
    color:#a23838;
    margin-bottom:12px;
    line-height:1.5;
  }
  .feedback-banner b{display:block;margin-bottom:3px;font-size:12px;}
  .feedback-banner .fb-time{display:block;margin-top:5px;font-size:11px;color:#c07e7e;}
  /* ---- Khung soạn thảo Blog (kiểu Word) ---- */
  .blog-toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:6px;
    margin-bottom:8px;padding:6px;background:#f4f6f9;border:1px solid var(--border);border-radius:8px 8px 0 0;
  }
  .blog-tb-btn{
    background:#fff;border:1px solid var(--border);border-radius:6px;
    padding:5px 9px;font-size:12.5px;cursor:pointer;color:var(--text);
  }
  .blog-tb-btn:hover{background:#eef1f7;}
  .blog-tb-hint{font-size:11px;color:var(--muted);margin-left:auto;}
  .blog-editor{
    border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;
    min-height:160px;max-height:640px;overflow-y:auto;
    padding:14px 16px;font-size:14px;line-height:1.7;background:#fff;outline:none;
  }
  .blog-editor:empty:before{content:attr(data-placeholder);color:var(--muted);}
  .blog-editor img{max-width:100%;border-radius:8px;margin:8px 0;display:block;}
  .blog-editor h2{font-size:19px;margin:14px 0 6px;}
  .blog-editor h3{font-size:16px;margin:12px 0 6px;}
  .blog-editor p{margin:0 0 10px;}
  .blog-editor ul{margin:0 0 10px 20px;}
  /* Nội dung blog hiển thị trong popup xem chi tiết */
  .view-blog-body{
    font-size:14px;line-height:1.7;max-height:520px;overflow-y:auto;
    padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#fdfdfd;
  }
  .view-blog-body img{max-width:100%;border-radius:8px;margin:8px 0;display:block;}
  .view-blog-body h2{font-size:18px;margin:12px 0 6px;}
  .view-blog-body h3{font-size:15px;margin:10px 0 6px;}
  .view-blog-body p{margin:0 0 10px;}
  .card-thumb{
    width:100%;
    height:110px;
    object-fit:cover;
    border-radius:8px;
    background:#f0f2f6;
  }
  .card-meta-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    color:var(--muted);
    font-weight:600;
  }
  .card-title{
    font-size:13.5px;
    font-weight:600;
    line-height:1.4;
    color:var(--text);
  }
  .badges{display:flex;flex-wrap:wrap;gap:5px;}
  .badge{
    font-size:10.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge-pillar{background:#fde3cf;color:#c96a1f;}
  .badge-product{background:#dcefe0;color:#2f8a4c;}
  .badge-cta{background:#fdf1c7;color:#a8790c;}
  .badge-channel{background:#e3e9fd;color:#3f5bd9;}
  .card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    color:var(--muted);
  }
  .card-footer a{color:var(--accent);text-decoration:none;font-weight:600;}
  .card-footer a:hover{text-decoration:underline;}
  .footer-right{display:flex;align-items:center;gap:8px;}
  .card-delete-btn{
    background:transparent;
    border:none;
    color:#c0392b;
    cursor:pointer;
    font-size:13px;
    padding:2px;
    line-height:1;
    opacity:.55;
  }
  .card-delete-btn:hover{opacity:1;}
  .assignee{
    display:flex;align-items:center;gap:5px;
  }
  .avatar{
    width:18px;height:18px;border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:9px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  /* modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,25,40,.4);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    position:relative;
    background:#fff;
    border-radius:14px;
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow-y:auto;
    padding:22px 24px 20px;
  }
  .modal h2{margin:0 0 16px;font-size:17px;padding-right:30px;}
  .modal-close-x{
    position:absolute;
    top:14px;
    right:14px;
    width:28px;
    height:28px;
    padding:0;
    border-radius:50%;
    background:#f0f2f6;
    color:var(--muted);
    font-size:14px;
    font-weight:700;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
  }
  .modal-close-x:hover{background:#e2e6ee;color:var(--text);}
  /* Khung xem chi tiết (view/tradeView) không có h2 nên không có khoảng trống tự nhiên
     phía trên/bên phải cho nút X — chừa thêm đệm trên cùng để chữ (VD: ngày đăng) không bị đè. */
  #viewModal, #tradeViewModal{padding-top:48px;}
  #viewModal .view-meta-row, #tradeViewModal .view-meta-row{padding-right:34px;}
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:5px;
  }
  .field input[type=text], .field input[type=date], .field input[type=url], .field select, .field textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 10px;
    font-size:13.5px;
    font-family:inherit;
    outline:none;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* custom date picker: giữ ô nhập tay dd/mm/yyyy, thêm nút mở lịch sổ ra */
  .date-field-wrap{position:relative;}
  .date-field-wrap input{padding-right:34px;}
  .date-cal-btn{
    position:absolute;
    right:4px;
    top:50%;
    transform:translateY(-50%);
    background:transparent;
    border:none;
    cursor:pointer;
    font-size:15px;
    padding:5px 6px;
    color:var(--muted);
    line-height:1;
  }
  .date-cal-btn:hover{color:var(--accent-dark);}
  .date-picker-pop{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    z-index:200;
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 8px 24px rgba(20,25,40,.14);
    padding:10px;
    width:250px;
    display:none;
  }
  .date-picker-pop.open{display:block;}
  .dp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .dp-header .dp-title{font-size:12.5px;font-weight:700;color:var(--text);}
  .dp-nav{background:#eef1f7;border:none;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:13px;color:var(--text);}
  .dp-nav:hover{background:#e2e6ee;}
  .dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:4px;}
  .dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .dp-day{
    text-align:center;
    font-size:12px;
    padding:6px 0;
    border-radius:6px;
    cursor:pointer;
    color:var(--text);
  }
  .dp-day:hover{background:#eef1f7;}
  .dp-day.dp-muted{color:#c3c8d4;}
  .dp-day.dp-selected{background:var(--accent);color:#fff;font-weight:700;}
  .dp-day.dp-today{outline:1px solid var(--accent);outline-offset:-1px;}
  .dp-footer{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
  .dp-footer button{
    background:#eef1f7;color:var(--text);border:none;border-radius:6px;
    padding:5px 10px;font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .dp-footer button:hover{background:#e2e6ee;}

  .channel-checks{display:flex;flex-wrap:wrap;gap:8px;}
  .channel-checks label{
    display:flex;align-items:center;gap:5px;
    font-size:12.5px;font-weight:600;color:var(--text);
    border:1px solid var(--border);
    padding:5px 10px;
    border-radius:20px;
    cursor:pointer;
  }
  .channel-checks input{margin:0;}
  .modal-actions{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    gap:8px;
  }
  .modal-actions .right{display:flex;gap:8px;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5;}
  /* ---- Modal Thêm/Sửa content: chuyển thành khung trượt ra từ bên phải, rộng & thoáng hơn ---- */
  #overlay{
    display:flex !important;
    justify-content:flex-end;
    align-items:stretch;
    padding:0;
    background:rgba(20,25,40,.4);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s ease,visibility 0s linear .22s;
  }
  #overlay.open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transition:opacity .22s ease;
  }
  #overlay .modal{
    width:100%;
    max-width:720px;
    height:100%;
    max-height:100vh;
    border-radius:16px 0 0 16px;
    padding:26px 36px 24px;
    box-shadow:-12px 0 32px rgba(20,25,40,.18);
    transform:translateX(24px);
    transition:transform .28s cubic-bezier(.22,.8,.32,1);
  }
  #overlay.open .modal{transform:translateX(0);}
  #overlay #fBody.blog-editor{min-height:340px;}
  @media (max-width:760px){
    #overlay .modal{max-width:100%;border-radius:0;padding:22px 18px 20px;}
  }
  .empty-state{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:20px 8px;
  }
  #importFile{display:none;}

  /* group by year / month / week — accordion (thanh ngang, bấm để mở/đóng) ở cả 3 cấp */
  .year-block{margin-bottom:22px;}
  .year-block:last-child{margin-bottom:0;}
  .month-block{margin-bottom:10px;}
  .month-block:last-child{margin-bottom:0;}
  .week-block{margin-bottom:8px;}
  .week-block:last-child{margin-bottom:0;}

  .month-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.03em;
    padding-bottom:8px;
    margin-bottom:14px;
    border-bottom:1px solid var(--border);
  }

  .acc-bar{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    font-weight:700;
    color:var(--text);
    user-select:none;
  }
  .acc-bar:hover{background:#f8f9fc;}
  .acc-bar.level-year{font-size:14.5px;}
  .acc-bar.level-month{font-size:13px;}
  .acc-bar.level-week{
    font-size:12.5px;
    font-weight:600;
    background:#f8f9fc;
    padding:9px 14px;
  }
  .acc-right{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;}
  .acc-caret{color:var(--muted);font-size:11px;}
  .acc-muted-tag{color:var(--muted);font-weight:500;font-size:.92em;}
  .acc-current-tag{color:var(--accent-dark);font-weight:700;margin-left:6px;font-size:.85em;}

  .acc-body{display:none;padding-top:10px;}
  .acc-body.open{display:block;}
  .acc-body.level-year-body{padding-left:14px;border-left:2px solid var(--border);margin-left:6px;}
  .acc-body.level-month-body{padding-left:14px;border-left:2px solid var(--border);margin-left:6px;padding-top:10px;}
  .acc-body.level-week-body{padding-top:12px;}
  .sync-status{
    font-size:11.5px;
    font-weight:700;
    color:var(--muted);
    padding:6px 10px;
    background:#eef1f7;
    border-radius:20px;
    white-space:nowrap;
    cursor:pointer;
  }
  .sync-status:hover{background:#e2e6ee;}
  .sync-status.ok{background:#e2f5e9;color:#1a7f4c;}
  .sync-status.error{background:#fdeceb;color:#d64545;}
  .sync-status.syncing{background:#eaf0fd;color:#3860c9;}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab-btn{
    background:transparent;
    color:var(--muted);
    border:1px solid transparent;
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
  }
  .tab-btn:hover{background:#eef1f7;color:var(--text);}
  .tab-btn.active{background:#eaf0fd;color:var(--accent-dark);}
  .hidden-section{display:none;}
  .sub-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}

  .task-table-wrap{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow-x:auto;
  }
  .task-table{width:100%;border-collapse:collapse;font-size:13px;}
  .task-table th{
    text-align:left;
    padding:11px 16px;
    background:#f4f6f9;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  .task-table td{
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    vertical-align:top;
    max-width:280px;
  }
  .task-table tr:last-child td{border-bottom:none;}
  .task-table td:last-child{width:36px;text-align:center;max-width:36px;}
  .task-row-delete{font-size:15px;opacity:.6;}
  .task-row-delete:hover{opacity:1;}
  .task-table tbody tr{cursor:pointer;}
  .task-table tbody tr:hover{background:#f8f9fc;}
  .task-name{font-weight:600;color:var(--text);}
  .task-progress{white-space:nowrap;color:var(--muted);font-weight:600;font-size:12.5px;}
  .task-text{color:var(--text);white-space:pre-wrap;line-height:1.5;}
  .task-empty{padding:28px;text-align:center;color:var(--muted);font-size:12.5px;}

  /* view-only content modal */
  .view-thumb{
    width:100%;
    max-height:260px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:14px;
    background:#f0f2f6;
  }
  .view-meta-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    margin-bottom:6px;
  }
  .view-content{
    font-size:15px;
    font-weight:600;
    color:var(--text);
    line-height:1.6;
    white-space:pre-wrap;
    margin-bottom:14px;
  }
  .view-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .view-badges .badge{font-size:11.5px;padding:4px 10px;}
  .view-details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px 20px;
    border-top:1px solid var(--border);
    padding-top:14px;
  }
  .view-field{font-size:13px;}
  .view-field label{
    display:block;
    font-size:11px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.02em;
    margin-bottom:3px;
  }
  .view-field .value{color:var(--text);}
  .view-field .value.empty{color:var(--muted);font-style:italic;}
  .view-field a{color:var(--accent);text-decoration:none;font-weight:600;}
  .view-field a:hover{text-decoration:underline;}
  .view-field.full{grid-column:1 / -1;}

  /* Trade Marketing */
  .activity-checks{display:flex;flex-wrap:wrap;gap:8px;}
  .activity-checks label{
    display:flex;align-items:center;gap:5px;
    font-size:12.5px;font-weight:600;color:var(--text);
    border:1px solid var(--border);
    padding:5px 10px;
    border-radius:20px;
    cursor:pointer;
  }
  .activity-checks input{margin:0;}
  .badge-status-pending{background:#fdf1c7;color:#a8790c;}
  .badge-status-approved{background:#dcefe0;color:#2f8a4c;}
  .links-list{display:flex;flex-direction:column;gap:4px;}
  .links-list a{color:var(--accent);font-weight:600;text-decoration:none;font-size:12.5px;}
  .links-list a:hover{text-decoration:underline;}

  /* Event Layout gate */
  .layout-gate{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
    padding:70px 20px;
    color:var(--muted);
  }
  .layout-gate .lock-icon{font-size:40px;}
  .layout-frame-wrap{
    position:relative;
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    height:calc(100vh - 140px);
    min-height:600px;
  }
  #layoutFrame{width:100%;height:100%;border:none;display:block;}
  .layout-time-lock{
    display:none;
    position:absolute;
    inset:0;
    z-index:30;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
    padding:20px;
    color:#fff;
    background:rgba(31,36,48,.88);
    backdrop-filter:blur(3px);
  }
  .layout-time-lock.show{display:flex;}
  .layout-time-lock .lock-icon{font-size:40px;}
  .layout-time-lock button{background:var(--accent);color:#fff;}
  .layout-time-lock button:hover{background:var(--accent-dark);}

  /* Card grid: equal height across a row + clamp long titles (full text still shown in the popup) */
  .content-grid{align-items:stretch;}
  .card{height:100%;}
  /* Chiều cao cố định cho phần tiêu đề (3 dòng) để hàng nhãn/tag bên dưới luôn thẳng hàng,
     bất kể nội dung phía trên ngắn hay dài. */
  .card-title{
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
    height:57px;
  }

  /* Content đã nằm gọn trong khối "Tuần" của nó rồi nên bỏ chữ "Tuần" lặp lại trên từng card,
     đồng thời làm nổi bật ngày đăng để dễ quan sát. Chỉ áp dụng cho card content (#board),
     không ảnh hưởng card Trade Marketing (cũng dùng chung class .card-meta-top). */
  #board .card-meta-top{justify-content:flex-start;}
  #board .card-meta-top span:first-child{display:none;}
  #board .card-meta-top span:last-child{
    font-weight:800;
    font-size:13px;
    color:#fff;
    background:var(--accent);
    padding:2px 10px;
    border-radius:12px;
    letter-spacing:.02em;
  }

  /* Image upload (content form) */
  .thumb-upload-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .thumb-upload-row input[type=url]{flex:1;min-width:160px;}
  .thumb-upload-preview{
    display:none;
    width:100%;
    max-height:160px;
    object-fit:cover;
    border-radius:8px;
    margin-top:8px;
    background:#f0f2f6;
    border:1px solid var(--border);
  }
  .thumb-upload-preview.show{display:block;}
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span> <span class="kafkax-brand">KAFKA X</span></h1>
  <div class="standalone-page-label" style="font-size:13px;color:var(--muted,#6b7280);font-weight:600;">📋 Content Planner</div>
  <div class="toolbar">
    <span class="sync-status" id="syncStatus" title="Trạng thái đồng bộ Supabase">⚪ Đang kết nối...</span>
  </div>
</header>

<main>
  <section id="plannerSection">
    <div class="planner-view-switch" id="plannerViewSwitch">
      <button type="button" class="view-switch-btn active" id="viewBoardBtn">📋 Bảng nội dung</button>
      <button type="button" class="view-switch-btn" id="viewStatsBtn">📊 Thống kê tháng</button>
      <button type="button" class="stats-toggle-btn" id="statsToggleBtn" title="Ẩn/hiện tab Thống kê tháng">⚙️ Ẩn thống kê</button>
    </div>

    <div id="plannerBoardView">
      <div class="sub-toolbar">
        <input type="text" id="searchBox" placeholder="Tìm nội dung...">
        <select id="filterMonth"><option value="">Tất cả tháng</option></select>
        <select id="filterStatus"><option value="">Tất cả Trạng thái</option></select>
        <select id="filterBrand"><option value="">Tất cả Thương hiệu</option></select>
        <select id="filterPillar"><option value="">Tất cả Pillar</option></select>
        <select id="filterChannel"><option value="">Tất cả Kênh</option></select>
        <button class="btn-ghost" id="exportBtn">⬇ Export JSON</button>
        <button class="btn-ghost" id="exportExcelBtn">⬇ Export Excel</button>
        <button class="btn-ghost" id="importBtn">⬆ Import JSON</button>
        <input type="file" id="importFile" accept="application/json">
        <button class="btn-primary" id="addBtn">+ Thêm Content</button>
      </div>
      <div class="grid-count" id="gridCount"></div>
      <div id="board"></div>
    </div>

    <div id="plannerStatsView" class="hidden-section">
      <div class="stats-toolbar">
        <span class="stats-toolbar-label">🗓️ Xem thống kê của:</span>
        <select id="statsMonthSelect"></select>
      </div>
      <div id="statsContent"></div>
    </div>
  </section>

</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <button type="button" class="modal-close-x" id="modalCloseX" title="Đóng">✕</button>

    <form id="cardForm">
      <input type="hidden" id="cardId">
      <div class="row2">
        <div class="field">

          <select id="fWeek"></select>

      <div class="row2">
        <div class="field">
          <label>Thương hiệu</label>

        <div class="field">
          <label>Định dạng nội dung</label>
          <select id="fFormat"></select>
        </div>
      </div>

          <label>Pillar</label>
          <select id="fPillar"></select>
        </div>
        <div class="field">
          <label>Trạng thái</label>
          <select id="fStatus"></select>
        </div>

          <label>Sản phẩm</label>
          <select id="fProduct"></select>
        </div>
        <div class="field">
          <label>CTA</label>
          <input type="text" id="fCta" placeholder="VD: Inbox tư vấn">
        </div>
      </div>
      <div class="field">
        <label>Kênh đăng</label>
        <div class="channel-checks" id="channelChecks"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Người phụ trách</label>
          <input type="text" id="fAssignee" placeholder="VD: Trường">
        </div>
        <div class="field">
          <label style="display:none">Deadline</label>
          <input type="text" id="fDeadline" placeholder="dd/mm/yyyy" inputmode="numeric" maxlength="10" style="display:none">
        </div>
      </div>
      <div class="field">
        <label>Link bài đăng</label>
        <input type="url" id="fLink" placeholder="https://...">
      </div>
      <div class="field">
        <label>Ảnh thumbnail</label>
        <div class="thumb-upload-row">
          <input type="url" id="fThumb" placeholder="https://... (hoặc tải ảnh lên)">

        </div>
        <img id="fThumbPreview" class="thumb-upload-preview" alt="Xem trước ảnh thumbnail">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="deleteBtn">Xóa</button>
        <div class="right">
          <button type="button" class="btn-ghost" id="cancelBtn">Hủy</button>
          <button type="submit" class="btn-primary">Lưu</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="viewOverlay">

    processBoard();
    new MutationObserver(processBoard).observe(board, { childList: true, subtree: true });

<script>
(function () {
  // Tải ảnh thumbnail thật (không chỉ nhập URL) cho mục tạo/sửa content.
  // Ảnh được nén & thu nhỏ ở phía trình duyệt rồi lưu dưới dạng data URL vào đúng field fThumb hiện có,
  // nên toàn bộ logic lưu/hiển thị ảnh (card, popup xem chi tiết) không cần thay đổi gì thêm.
  var urlInput = document.getElementById('fThumb');
  var fileInput = document.getElementById('fThumbFile');
  var uploadBtn = document.getElementById('fThumbUploadBtn');
  var preview = document.getElementById('fThumbPreview');
  if (!urlInput || !fileInput || !uploadBtn || !preview) return;

  var MAX_DIMENSION = 1600;
  var MAX_DATAURL_LENGTH = 700000; // ~700KB, chừa dư địa an toàn dưới giới hạn 1MB/tài liệu của Firestore
  var QUALITY_STEPS = [0.82, 0.7, 0.55, 0.4, 0.28];

  function updatePreview() {
    if (urlInput.value) {
      preview.src = urlInput.value;
      preview.classList.add('show');
    } else {
      preview.classList.remove('show');
      preview.removeAttribute('src');
    }
  }

  function compressToDataUrl(canvas) {
    for (var i = 0; i < QUALITY_STEPS.length; i++) {
      var url = canvas.toDataURL('image/jpeg', QUALITY_STEPS[i]);
      if (url.length <= MAX_DATAURL_LENGTH) return url;
    }
    return canvas.toDataURL('image/jpeg', QUALITY_STEPS[QUALITY_STEPS.length - 1]);
  }

  uploadBtn.addEventListener('click', function () {
    fileInput.click();
  });

  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    if (!file.type || file.type.indexOf('image/') !== 0) {
      alert('Vui lòng chọn một file hình ảnh.');
      return;
    }

    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth || 1;
        var h = img.naturalHeight || 1;
        var scale = Math.min(1, MAX_DIMENSION / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw;
        canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);

        var dataUrl = compressToDataUrl(canvas);
        if (dataUrl.length > MAX_DATAURL_LENGTH * 1.3) {
          alert('Ảnh khá nặng dù đã nén, có thể đồng bộ chậm. Nếu được, hãy chọn ảnh nhỏ/nhẹ hơn.');
        }
        urlInput.value = dataUrl;
        updatePreview();
      };
      img.onerror = function () {
        alert('Không đọc được ảnh này, vui lòng thử ảnh khác.');
      };
      img.src = e.target.result;
    };
    reader.onerror = function () {
      alert('Có lỗi khi đọc file ảnh.');
    };
    reader.readAsDataURL(file);
  });

  urlInput.addEventListener('input', updatePreview);

  // Cập nhật preview mỗi khi modal tạo/sửa content được mở (kể cả khi mở để sửa content có sẵn).
  var overlay = document.getElementById('overlay');
  if (overlay) {
    new MutationObserver(function () {
      if (overlay.classList.contains('open')) updatePreview();
    }).observe(overlay, { attributes: true, attributeFilter: ['class'] });
  }
})();
</script>

<script>
(function () {
  // Mỗi "Tuần" một màu riêng (thanh accordion + viền trái của khối content) để dễ phân biệt các tuần.
  var WEEK_COLORS = {
    'Tuần 1': { bg: '#e3e9fd', color: '#3f5bd9' },
    'Tuần 2': { bg: '#fde3cf', color: '#c96a1f' },
    'Tuần 3': { bg: '#dcefe0', color: '#2f8a4c' },
    'Tuần 4': { bg: '#fdf1c7', color: '#a8790c' },
    'Tuần 5': { bg: '#f4c7c3', color: '#990000' }
  };
  var DEFAULT_COLOR = { bg: '#efefef', color: '#434343' };

  function colorForWeek(label) {
    return WEEK_COLORS[(label || '').trim()] || DEFAULT_COLOR;
  }

  function processWeekColors() {
    document.querySelectorAll('.week-block').forEach(function (block) {
      var bar = block.querySelector('.acc-bar.level-week');
      var body = block.querySelector('.acc-body.level-week-body');

<script>
(function () {
  // Trong mỗi tuần, sắp xếp các content theo ngày tăng dần (ngày nhỏ/cũ hơn hiển thị trước, bên trái).
  // Mỗi khối .content-grid chỉ chứa content của đúng 1 tháng + 1 tuần nên chỉ cần so sánh theo "ngày" (dd) là đủ chính xác.
  function dayOf(cardEl) {
    var spans = cardEl.querySelectorAll('.card-meta-top span');
    var dateText = spans[1] ? spans[1].textContent.trim() : '';
    var m = dateText.match(/^(\d{1,2})\/(\d{1,2})$/);
    if (!m) return Infinity; // content chưa có ngày -> đẩy xuống cuối
    return parseInt(m[1], 10);
  }

  function sortGridAscending(grid) {
    var current = Array.prototype.slice.call(grid.children);
    var sorted = current.slice().sort(function (a, b) { return dayOf(a) - dayOf(b); });
    for (var i = 0; i < sorted.length; i++) {
      if (grid.children[i] !== sorted[i]) {
        grid.insertBefore(sorted[i], grid.children[i] || null);
      }
    }
  }

  function processSorting() {
    document.querySelectorAll('.content-grid').forEach(sortGridAscending);
  }

  var board = document.getElementById('board');
  if (board) {
    processSorting();
    new MutationObserver(processSorting).observe(board, { childList: true, subtree: true });
  }
})();
</script>

<script>
(function(){
  // ---- Toolbar định dạng + chèn ảnh + dán ảnh (Ctrl+V) cho khung soạn thảo nội dung (dùng chung ngắn/dài) ----
  function ready(fn){ if(document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
  ready(function(){
    var editor = document.getElementById('fBody');
    if(!editor) return;

    document.querySelectorAll('.blog-tb-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault();
        editor.focus();
        var cmd = btn.getAttribute('data-cmd');
        var block = btn.getAttribute('data-block');
        if(cmd){ document.execCommand(cmd, false, null); }
        else if(block){ document.execCommand('formatBlock', false, block); }
      });
    });

    function insertImageFile(file){
      if(!file || !file.type || file.type.indexOf('image/') !== 0) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          // Giới hạn chiều rộng tối đa 1280px và nén JPEG chất lượng 0.72
          // để bài blog nhiều ảnh không bị quá nặng khi lưu lên Supabase.
          var maxW = 1280;
          var scale = Math.min(1, maxW / img.width);
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var compressed = canvas.toDataURL('image/jpeg', 0.72);
          editor.focus();
          document.execCommand('insertImage', false, compressed);
        };
        img.onerror = function(){
          // Nếu vì lý do gì đó không đọc được làm ảnh để nén, vẫn chèn ảnh gốc để không mất thao tác của người dùng.
          editor.focus();
          document.execCommand('insertImage', false, ev.target.result);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    var imgBtn = document.getElementById('fBlogImgBtn');
    var imgFile = document.getElementById('fBlogImgFile');
    if(imgBtn && imgFile){
      imgBtn.addEventListener('click', function(e){ e.preventDefault(); imgFile.click(); });
      imgFile.addEventListener('change', function(){
        if(imgFile.files && imgFile.files[0]) insertImageFile(imgFile.files[0]);
        imgFile.value = '';
      });
    }

    editor.addEventListener('paste', function(e){
      var clipboard = e.clipboardData || window.clipboardData;
      var items = clipboard ? clipboard.items : null;
      if(items){
        for(var i=0;i<items.length;i++){
          if(items[i].type && items[i].type.indexOf('image/') === 0){
            e.preventDefault();
            insertImageFile(items[i].getAsFile());
            return;
          }
        }
      }
      var text = clipboard ? clipboard.getData('text/plain') : '';
      if(text){
        e.preventDefault();
        document.execCommand('insertText', false, text);
      }
    });
  });
})();
</script>

<script>
(function(){
  // ==========================================================================
  // Thông báo popup: hiện khi có content được cập nhật / phê duyệt.
  // Hoạt động độc lập với script chính phía trên (không đụng vào code cũ),
  // dựa trên việc so sánh dữ liệu trong localStorage theo thời gian — dữ liệu
  // này được đồng bộ real-time (Supabase) và cũng được ghi lại mỗi khi có ai
  // thao tác, nên phát hiện được cả thay đổi do người khác thực hiện.
  // ==========================================================================

  var STACK = document.getElementById('toastStack');
  var MAX_TOASTS = 4;

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function truncate(str, n){
    str = String(str || '').replace(/<[^>]*>/g, '').trim();
    return str.length > n ? str.slice(0, n) + '…' : str;
  }

  function showToast(opts){
    if (!STACK) return;
    var isApprove = opts.type === 'approve';
    var icon = isApprove ? '✅' : opts.type === 'new' ? '🆕' : opts.type === 'delete' ? '🗑️' : '📝';

    var el = document.createElement('div');
    el.className = 'toast-item' + (isApprove ? ' toast-approve' : '') + (opts.type === 'delete' ? ' toast-delete' : '');
    el.innerHTML =
      '<span class="toast-icon">' + icon + '</span>' +
      '<span class="toast-body">' +
        '<div class="toast-title">' + escapeHtml(opts.title) + '</div>' +
        '<div class="toast-msg">' + escapeHtml(opts.message) + '</div>' +
      '</span>';
    STACK.appendChild(el);

    while (STACK.children.length > MAX_TOASTS) {
      STACK.removeChild(STACK.firstChild);
    }

    // Tự động biến mất sau ~5 giây với hiệu ứng nhẹ nhàng.
    setTimeout(function(){
      el.classList.add('toast-leave');
      setTimeout(function(){
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 400);
    }, 5000);

    // Nếu người dùng đang ở tab/ứng dụng khác, vẫn báo qua thông báo hệ thống
    // của trình duyệt (cần trình duyệt đã cấp quyền Notification).
    try {
      if (document.hidden && window.Notification && Notification.permission === 'granted') {
        var n = new Notification(opts.title, { body: opts.message, silent: false });
        setTimeout(function(){ n.close(); }, 6000);
      }
    } catch (e) { /* bỏ qua nếu trình duyệt không hỗ trợ */ }
  }

  // Xin quyền gửi thông báo hệ thống ngay khi người dùng có tương tác đầu tiên
  // với trang (nhiều trình duyệt yêu cầu phải có cử chỉ người dùng).
  try {
    if (window.Notification && Notification.permission === 'default') {
      var askPermissionOnce = function(){
        Notification.requestPermission();
        document.removeEventListener('click', askPermissionOnce);
      };
      document.addEventListener('click', askPermissionOnce, { once: true });
    }
  } catch (e) { /* bỏ qua nếu trình duyệt không hỗ trợ Notification */ }

  var CONTENT_KEY = 'content_planner_data_v1';
  var TASKS_KEY = 'content_planner_tasks_v1';
  var TRADE_KEY = 'content_planner_trade_events_v1';
  var APPROVED_CONTENT_STATUSES = ['Chờ xuất bản', 'Xuất bản'];

  function readJSON(key){
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }

  function snapshotOf(list, fields){
    var map = {};
    (list || []).forEach(function(item){
      if (!item || !item.id) return;
      map[item.id] = fields.map(function(f){
        return item[f] == null ? '' : String(item[f]);
      }).join('|');
    });
    return map;
  }

  var lastContent = snapshotOf(readJSON(CONTENT_KEY), ['status', 'content', 'bodyHtml']);
  var lastTasks = snapshotOf(readJSON(TASKS_KEY), ['progress', 'description', 'issue', 'solution']);
  var lastTrade = snapshotOf(readJSON(TRADE_KEY), ['status', 'name', 'description']);

  // Lưu tên/tiêu đề của từng mục tại lần kiểm tra gần nhất, để khi một mục bị
  // xóa vẫn hiển thị được tên của nó trong thông báo (lúc đó mục đã biến mất
  // khỏi dữ liệu nên không thể tra cứu lại được nữa).
  var lastLabels = { content: {}, trade: {}, tasks: {} };
  (function seedLabels(){
    readJSON(CONTENT_KEY).forEach(function(item){
      if (item && item.id) lastLabels.content[item.id] = truncate(item.content || item.bodyHtml || '', 60) || '(không có tiêu đề)';
    });
    readJSON(TRADE_KEY).forEach(function(item){
      if (item && item.id) lastLabels.trade[item.id] = truncate(item.name || '', 60) || '(không có tên sự kiện)';
    });
    readJSON(TASKS_KEY).forEach(function(item){
      if (item && item.id) lastLabels.tasks[item.id] = truncate(item.name || '', 60) || '(không có tên công việc)';
    });
  })();

  function checkContent(){
    var list = readJSON(CONTENT_KEY);
    var current = snapshotOf(list, ['status', 'content', 'bodyHtml']);
    var currentIds = {};

    list.forEach(function(item){
      if (!item || !item.id) return;
      currentIds[item.id] = true;
      var label = truncate(item.content || item.bodyHtml || '', 60) || '(không có tiêu đề)';
      var prevSig = lastContent[item.id];

      if (prevSig === undefined) {
        showToast({ type: 'new', title: 'Content mới được thêm', message: label });
        return;
      }
      if (prevSig === current[item.id]) return;

      var prevStatus = prevSig.split('|')[0];
      var becameApproved = APPROVED_CONTENT_STATUSES.indexOf(item.status) !== -1 &&
        APPROVED_CONTENT_STATUSES.indexOf(prevStatus) === -1;

      showToast(becameApproved ? {
        type: 'approve',
        title: 'Content đã được phê duyệt',
        message: label
      } : {
        type: 'update',
        title: 'Content vừa được cập nhật',
        message: label
      });
    });

    Object.keys(lastLabels.content).forEach(function(id){
      if (!currentIds[id]) {
        showToast({
          type: 'delete',
          title: 'Content đã bị xóa',
          message: lastLabels.content[id]
        });
      }
    });

    lastContent = current;
    lastLabels.content = {};
    list.forEach(function(item){
      if (item && item.id) {
        lastLabels.content[item.id] = truncate(item.content || item.bodyHtml || '', 60) || '(không có tiêu đề)';
      }
    });
  }

  function checkTrade(){
    var list = readJSON(TRADE_KEY);
    var current = snapshotOf(list, ['status', 'name', 'description']);
    var currentIds = {};

    list.forEach(function(item){
      if (!item || !item.id) return;
      currentIds[item.id] = true;
      var label = truncate(item.name || '', 60) || '(không có tên sự kiện)';
      var prevSig = lastTrade[item.id];

      if (prevSig === undefined) {
        showToast({ type: 'new', title: 'Sự kiện Trade Marketing mới được thêm', message: label });
        return;
      }
      if (prevSig === current[item.id]) return;

      var prevStatus = prevSig.split('|')[0];
      var becameApproved = item.status === 'Đã duyệt' && prevStatus !== 'Đã duyệt';

      showToast(becameApproved ? {
        type: 'approve',
        title: 'Sự kiện Trade Marketing đã được duyệt',
        message: label
      } : {
        type: 'update',
        title: 'Sự kiện Trade Marketing vừa cập nhật',
        message: label
      });
    });

    Object.keys(lastLabels.trade).forEach(function(id){
      if (!currentIds[id]) {
        showToast({
          type: 'delete',
          title: 'Sự kiện Trade Marketing đã bị xóa',
          message: lastLabels.trade[id]
        });
      }
    });

    lastTrade = current;
    lastLabels.trade = {};
    list.forEach(function(item){
      if (item && item.id) {
        lastLabels.trade[item.id] = truncate(item.name || '', 60) || '(không có tên sự kiện)';
      }
    });
  }

  function checkTasks(){
    var list = readJSON(TASKS_KEY);
    var current = snapshotOf(list, ['progress', 'description', 'issue', 'solution']);
    var currentIds = {};

    list.forEach(function(item){
      if (!item || !item.id) return;
      currentIds[item.id] = true;
      var label = truncate(item.name || '', 60) || '(không có tên công việc)';
      var prevSig = lastTasks[item.id];

      if (prevSig === undefined) {
        showToast({ type: 'new', title: 'Công việc mới được thêm', message: label });
        return;
      }
      if (prevSig === current[item.id]) return;

      showToast({ type: 'update', title: 'Công việc vừa được cập nhật', message: label });
    });

    Object.keys(lastLabels.tasks).forEach(function(id){
      if (!currentIds[id]) {
        showToast({
          type: 'delete',
          title: 'Công việc đã bị xóa',
          message: lastLabels.tasks[id]
        });
      }
    });

    lastTasks = current;
    lastLabels.tasks = {};
    list.forEach(function(item){
      if (item && item.id) {
        lastLabels.tasks[item.id] = truncate(item.name || '', 60) || '(không có tên công việc)';
      }
    });
  }

  function checkAll(){
    checkContent();
    checkTrade();
    checkTasks();
  }

  // Bắt thay đổi NGAY LẬP TỨC tại đúng thời điểm ứng dụng ghi dữ liệu vào
  // localStorage — kể cả khi dữ liệu đó vừa được đẩy về từ đồng bộ real-time
  // (Supabase) do người khác thao tác trên máy/thiết bị khác. Cách này không
  // dùng setInterval polling nên không bị trình duyệt "throttle" (làm chậm/
  // tạm dừng bộ đếm giờ) khi tab đang chạy nền hoặc người dùng đang ở ứng
  // dụng khác — vốn là lúc thông báo cần hiện ra nhất.
  var WATCHED_KEYS = [CONTENT_KEY, TASKS_KEY, TRADE_KEY];
  var nativeSetItem = Storage.prototype.setItem;
  var lastQuotaWarnAt = 0;

  function warnQuotaOnce(){
    var now = Date.now();
    if (now - lastQuotaWarnAt < 5 * 60 * 1000) return; // tối đa 1 lần / 5 phút
    lastQuotaWarnAt = now;
    showToast({
      type: 'delete',
      title: 'Bộ nhớ trình duyệt (localStorage) đã đầy',
      message: 'Dữ liệu vẫn được gửi lên Supabase bình thường, nhưng bộ nhớ cache cục bộ trên trình duyệt này đã đầy — nên kiểm tra lại các content có ảnh nhúng trực tiếp (base64) quá nặng.'
    });
  }

  Storage.prototype.setItem = function(key, value){
    var result;
    try {
      result = nativeSetItem.apply(this, arguments);
    } catch (err) {
      // QUAN TRỌNG: nếu localStorage đầy (QuotaExceededError), TUYỆT ĐỐI không
      // để lỗi này lan ra ngoài — nếu không, nó sẽ chặn đứng luôn bước gửi dữ
      // liệu lên Supabase ngay sau đó trong cùng hàm gọi (đây chính là nguyên
      // nhân khiến nhiều thay đổi "tưởng đã lưu" nhưng thực ra chưa từng lên
      // được server). Bỏ qua việc cache cục bộ, để ứng dụng tiếp tục chạy và
      // vẫn gửi được dữ liệu lên Supabase như bình thường.
      if (this === window.localStorage && err && (
        err.name === 'QuotaExceededError' ||
        err.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
        err.code === 22 || err.code === 1014
      )) {
        console.warn('[Kafka X] localStorage đầy — bỏ qua cache cục bộ cho key "' + key + '", dữ liệu vẫn tiếp tục gửi lên Supabase.', err);
        warnQuotaOnce();
        return;
      }
      throw err;
    }
    if (this === window.localStorage && WATCHED_KEYS.indexOf(key) !== -1) {
      // Chạy sau khi giá trị đã thực sự được ghi vào localStorage.
      setTimeout(checkAll, 0);
    }
    return result;
  };

  // Lưới an toàn dự phòng: nếu vì lý do nào đó việc ghi localStorage không đi
  // qua setItem (ví dụ trình duyệt lạ), vẫn kiểm tra định kỳ mỗi 15 giây.
  setInterval(checkAll, 15000);

  // Khi người dùng quay lại tab/trang sau khi rời đi, kiểm tra ngay để không
  // bỏ lỡ thay đổi xảy ra trong lúc họ vắng mặt.
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) checkAll();
  });

  // Bắt thay đổi ngay lập tức khi một tab khác (cùng trình duyệt) ghi localStorage.
  window.addEventListener('storage', function(e){
    if (e.key === CONTENT_KEY || e.key === TASKS_KEY || e.key === TRADE_KEY) {
      checkAll();
    }
  });
})();
</script>

<script>
(function(){
  // ==========================================================================
  // Tab "Thống kê tháng" trong Content Planner: tổng hợp hoạt động theo kênh,
  // thương hiệu, danh mục sản phẩm, người đăng và mốc thời gian trong tháng.
  // ==========================================================================

  var CONTENT_KEY = 'content_planner_data_v1';
  var APPROVED_STATUSES = ['Chờ xuất bản', 'Xuất bản'];

  var CHANNELS = [
    { key: 'Facebook', icon: '📘' },
    { key: 'TikTok', icon: '🎵' },
    { key: 'Instagram', icon: '📸' },
    { key: 'Threads', icon: '🧵' },
    { key: 'YouTube', icon: '▶️' },
    { key: 'Website', icon: '🌐' },
    { key: 'Zalo', icon: '💬' }
  ];
  var BRANDS = [
    { key: 'Travel', icon: '✈️' },
    { key: 'Communications', icon: '📣' },
    { key: 'Gift', icon: '🎁' },
    { key: 'Horeca', icon: '🍽️' },
    { key: 'Wellness Retreat', icon: '🧘' },
    { key: 'Real Estate', icon: '🏠' },
    { key: 'Trading', icon: '📈' },
    { key: 'Education', icon: '🎓' },
    { key: 'Working Cafe', icon: '☕' }
  ];
  var PRODUCTS = [
    { key: 'Tour', icon: '🧳' },
    { key: 'Vé máy bay', icon: '✈️' },
    { key: 'Visa', icon: '🛂' },
    { key: 'Cà phê', icon: '☕' },
    { key: 'Bất Động Sản', icon: '🏢' },
    { key: 'Retreat', icon: '🌿' },
    { key: 'Catering', icon: '🍽️' }
  ];

  function readContent(){
    try {
      var raw = localStorage.getItem(CONTENT_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }

  function pad2(n){ return String(n).length < 2 ? '0' + n : String(n); }
  function monthKeyOf(date){ return date.getFullYear() + '-' + pad2(date.getMonth() + 1); }

  function prevMonthKey(){
    var now = new Date();
    var d = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    return monthKeyOf(d);
  }

  function currentMonthKey(){
    return monthKeyOf(new Date());
  }

  function monthLabel(key){
    var parts = key.split('-');
    return 'Tháng ' + parseInt(parts[1], 10) + '/' + parts[0];
  }

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function initials(name){
    if (!name) return '?';
    return name.trim().split(/\s+/).map(function(w){ return w[0]; }).slice(-2).join('').toUpperCase();
  }

  function countBy(list, field, isArrayField){
    var map = {};
    list.forEach(function(item){
      if (isArrayField) {
        (item[field] || []).forEach(function(v){ map[v] = (map[v] || 0) + 1; });
      } else if (item[field]) {
        map[item[field]] = (map[item[field]] || 0) + 1;
      }
    });
    return map;
  }

  function computeStats(mKey){
    var all = readContent();
    var inMonth = all.filter(function(item){ return item && item.date && item.date.indexOf(mKey) === 0; });
    var posted = inMonth.filter(function(item){ return APPROVED_STATUSES.indexOf(item.status) !== -1; });

    var weekBuckets = [0, 0, 0, 0, 0];
    posted.forEach(function(item){
      var day = parseInt(item.date.slice(8, 10), 10) || 1;
      var idx = Math.min(4, Math.floor((day - 1) / 7));
      weekBuckets[idx]++;
    });

    return {
      totalPlanned: inMonth.length,
      totalPosted: posted.length,
      byChannel: countBy(posted, 'channels', true),
      byBrand: countBy(posted, 'brand', false),
      byProduct: countBy(posted, 'product', false),
      byAssignee: countBy(posted, 'assignee', false),
      weekBuckets: weekBuckets
    };
  }

  function renderStatCard(icon, label, count, total){
    var pct = total > 0 ? Math.round((count / total) * 100) : 0;
    return '<div class="stat-mini-card reveal-on-scroll">' +
      '<div class="stat-mini-icon">' + icon + '</div>' +
      '<div class="stat-mini-body">' +
        '<div class="stat-mini-label">' + escapeHtml(label) + '</div>' +
        '<div class="stat-mini-count">' + count + ' <span class="stat-mini-unit">bài</span></div>' +
        '<div class="stat-mini-bar"><div class="stat-mini-bar-fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
    '</div>';
  }

  function renderSection(title, itemsHtml){
    return '<div class="stats-section reveal-on-scroll">' +
      '<h3 class="stats-section-title">' + title + '</h3>' +
      '<div class="stats-grid">' + itemsHtml + '</div>' +
    '</div>';
  }

  function render(mKey){
    var stats = computeStats(mKey);
    var container = document.getElementById('statsContent');
    if (!container) return;

    var channelHtml = CHANNELS.map(function(c){
      return renderStatCard(c.icon, c.key, stats.byChannel[c.key] || 0, stats.totalPosted);
    }).join('');

    var brandHtml = BRANDS.map(function(b){
      return renderStatCard(b.icon, b.key, stats.byBrand[b.key] || 0, stats.totalPosted);
    }).join('');

    var productHtml = PRODUCTS.map(function(p){
      return renderStatCard(p.icon, p.key, stats.byProduct[p.key] || 0, stats.totalPosted);
    }).join('');

    var assigneeEntries = Object.keys(stats.byAssignee).sort(function(a, b){
      return stats.byAssignee[b] - stats.byAssignee[a];
    });
    var medals = ['🥇', '🥈', '🥉'];
    var assigneeHtml = assigneeEntries.length ? assigneeEntries.map(function(name, i){
      return '<div class="leaderboard-row reveal-on-scroll">' +
        '<span class="leaderboard-rank">' + (medals[i] || (i + 1)) + '</span>' +
        '<span class="leaderboard-avatar">' + initials(name) + '</span>' +
        '<span class="leaderboard-name">' + escapeHtml(name) + '</span>' +
        '<span class="leaderboard-count">' + stats.byAssignee[name] + ' bài</span>' +
      '</div>';
    }).join('') : '<div class="stats-empty">Chưa có dữ liệu người đăng trong tháng này.</div>';

    var maxWeek = Math.max.apply(null, stats.weekBuckets.concat([1]));
    var weekHtml = stats.weekBuckets.map(function(count, i){
      var h = Math.round((count / maxWeek) * 100);
      return '<div class="timeline-bar-wrap">' +
        '<div class="timeline-bar-count">' + count + '</div>' +
        '<div class="timeline-bar" style="height:' + Math.max(h, 4) + '%"></div>' +
        '<div class="timeline-bar-label">Tuần ' + (i + 1) + '</div>' +
      '</div>';
    }).join('');

    container.innerHTML =
      '<div class="stats-hero reveal-on-scroll">' +
        '<div class="stats-hero-icon">🚀</div>' +
        '<div class="stats-hero-number" data-count="' + stats.totalPosted + '">0</div>' +
        '<div class="stats-hero-label">Tổng số bài đăng (Chờ xuất bản / Xuất bản) trong ' + monthLabel(mKey) + '</div>' +
        '<div class="stats-hero-sub">' + stats.totalPlanned + ' content được lên kế hoạch trong tháng này</div>' +
      '</div>' +
      renderSection('📡 Theo từng kênh', channelHtml) +
      renderSection('🏷️ Theo từng thương hiệu', brandHtml) +
      renderSection('📦 Theo từng danh mục sản phẩm', productHtml) +
      '<div class="stats-section reveal-on-scroll">' +
        '<h3 class="stats-section-title">🏆 Người đăng nhiều nhất</h3>' +
        '<div class="leaderboard">' + assigneeHtml + '</div>' +
      '</div>' +
      '<div class="stats-section reveal-on-scroll">' +
        '<h3 class="stats-section-title">📅 Mốc thời gian trong tháng</h3>' +
        '<div class="timeline-chart">' + weekHtml + '</div>' +
      '</div>';

    animateCountUp();
    observeReveal();
  }

  function animateCountUp(){
    var el = document.querySelector('.stats-hero-number');
    if (!el) return;
    var target = parseInt(el.getAttribute('data-count'), 10) || 0;
    var steps = 30;
    var inc = target / steps;
    var i = 0;
    var timer = setInterval(function(){
      i++;
      var current = Math.min(target, Math.round(inc * i));
      el.textContent = current;
      if (i >= steps || current >= target) {
        el.textContent = target;
        clearInterval(timer);
      }
    }, 30);
  }

  var revealObserver = null;
  function observeReveal(){
    if (!('IntersectionObserver' in window)) {
      var els = document.querySelectorAll('.reveal-on-scroll');
      for (var k = 0; k < els.length; k++) els[k].classList.add('revealed');
      return;
    }
    if (!revealObserver) {
      revealObserver = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });
    }
    var pending = document.querySelectorAll('.reveal-on-scroll:not(.revealed)');
    for (var j = 0; j < pending.length; j++) revealObserver.observe(pending[j]);
  }

  function buildMonthOptions(){
    var select = document.getElementById('statsMonthSelect');
    if (!select) return;
    var all = readContent();
    var seen = {};
    var keys = [];
    all.forEach(function(item){
      if (item && item.date && item.date.length >= 7) {
        var k = item.date.slice(0, 7);
        if (!seen[k]) { seen[k] = true; keys.push(k); }
      }
    });
    var defaultKey = prevMonthKey();
    if (!seen[defaultKey]) keys.push(defaultKey);
    keys.sort().reverse();
    select.innerHTML = keys.map(function(k){
      return '<option value="' + k + '">' + monthLabel(k) + '</option>';
    }).join('');
    select.value = defaultKey;
  }

  function refreshStats(){
    var select = document.getElementById('statsMonthSelect');
    var key = select && select.value ? select.value : prevMonthKey();
    render(key);
  }

  var boardBtn = document.getElementById('viewBoardBtn');
  var statsBtn = document.getElementById('viewStatsBtn');
  var boardView = document.getElementById('plannerBoardView');
  var statsView = document.getElementById('plannerStatsView');

  function showBoardView(){
    if (boardBtn) boardBtn.classList.add('active');
    if (statsBtn) statsBtn.classList.remove('active');
    if (boardView) boardView.classList.remove('hidden-section');
    if (statsView) statsView.classList.add('hidden-section');
  }

  function showStatsView(forceMonthKey){
    if (statsBtn) statsBtn.classList.add('active');
    if (boardBtn) boardBtn.classList.remove('active');
    if (statsView) statsView.classList.remove('hidden-section');
    if (boardView) boardView.classList.add('hidden-section');
    buildMonthOptions();
    var select = document.getElementById('statsMonthSelect');
    if (forceMonthKey && select) {
      var hasOption = Array.prototype.some.call(select.options, function(o){ return o.value === forceMonthKey; });
      if (!hasOption) {
        var opt = document.createElement('option');
        opt.value = forceMonthKey;
        opt.textContent = monthLabel(forceMonthKey);
        select.insertBefore(opt, select.firstChild);
      }
      select.value = forceMonthKey;
    }
    refreshStats();
  }

  if (boardBtn) boardBtn.addEventListener('click', showBoardView);
  if (statsBtn) statsBtn.addEventListener('click', showStatsView);
  var monthSelect = document.getElementById('statsMonthSelect');
  if (monthSelect) monthSelect.addEventListener('change', refreshStats);

  window.__vinhShowStatsView = showStatsView;

  // ==========================================================================
  // ⚙️ Ẩn/hiện toàn bộ tính năng "Thống kê tháng" tùy ý — khi ẩn, cả nút chuyển
  // tab lẫn trang cover đầu/cuối tháng đều tự động ẩn theo. Trạng thái được
  // lưu trong trình duyệt (localStorage) nên vẫn giữ nguyên sau khi F5.
  // ==========================================================================
  var STATS_ENABLED_KEY = 'vps_stats_feature_enabled';
  var statsToggleBtn = document.getElementById('statsToggleBtn');

  function isStatsFeatureEnabled(){
    var v = localStorage.getItem(STATS_ENABLED_KEY);
    return v === null ? true : v === '1'; // mặc định: bật
  }

  function closeCoverImmediately(){
    var overlay = document.getElementById('statsCoverOverlay');
    if (overlay) {
      overlay.classList.remove('open');
      overlay.classList.remove('closing');
    }
  }

  function applyStatsFeatureVisibility(){
    var enabled = isStatsFeatureEnabled();

    if (statsBtn) statsBtn.style.display = enabled ? '' : 'none';

    if (!enabled) {
      // Nếu đang mở tab Thống kê mà bị tắt tính năng, quay về Bảng nội dung.
      if (statsView && !statsView.classList.contains('hidden-section')) {
        showBoardView();
      }
      // Cover cũng phải ẩn theo ngay lập tức, không chờ tự động biến mất.
      closeCoverImmediately();
    }

    if (statsToggleBtn) {
      statsToggleBtn.textContent = enabled ? '⚙️ Ẩn thống kê' : '⚙️ Hiện thống kê';
      statsToggleBtn.title = enabled
        ? 'Ẩn tab Thống kê tháng và trang cover đầu/cuối tháng'
        : 'Hiện lại tab Thống kê tháng';
    }
  }

  if (statsToggleBtn) {
    statsToggleBtn.addEventListener('click', function(){
      var next = !isStatsFeatureEnabled();
      localStorage.setItem(STATS_ENABLED_KEY, next ? '1' : '0');
      applyStatsFeatureVisibility();
    });
  }

  applyStatsFeatureVisibility();
  window.__vinhIsStatsFeatureEnabled = isStatsFeatureEnabled;

  // ==========================================================================
  // ⚙️ CẤU HÌNH TRANG COVER THỐNG KÊ ĐẦU/CUỐI THÁNG — chỉnh trực tiếp tại đây
  // ==========================================================================
  var COVER_CONFIG = {
    // Cover sẽ hiện nếu ngày hiện tại (theo lịch máy tính) >= START_DAY
    // (tính từ cuối tháng) HOẶC <= END_DAY (tính từ đầu tháng kế tiếp).
    // Mặc định: từ ngày 28 tháng trước đến ngày 5 tháng sau.
    START_DAY: 28,   // đổi thành 25 nếu muốn hiện sớm hơn (từ ngày 25), v.v.
    END_DAY: 5,      // đổi thành 10 nếu muốn hiện tới ngày 10 tháng sau, v.v.

    // Số giây cover hiển thị trước khi tự biến mất và chuyển vào tab Thống kê.
    DISPLAY_SECONDS: 5,

    // true  = mỗi phiên trình duyệt (mỗi lần mở tab mới) chỉ hiện cover 1 lần,
    //         dù người dùng có tải lại (F5) trang nhiều lần trong ngày.
    // false = hiện lại mỗi lần tải trang, miễn là vẫn trong khoảng ngày cho phép.
    SHOW_ONCE_PER_SESSION: true,

    // true  = bật cover; false = tắt hẳn tính năng cover (chỉ dùng tab Thống kê
    //         bằng cách bấm nút "📊 Thống kê tháng" như bình thường).
    ENABLED: true
  };
  var COVER_SESSION_KEY = 'vps_stats_cover_shown';
  // ==========================================================================
  // ⚙️ Hết phần cấu hình — không cần chỉnh gì bên dưới đây.
  // ==========================================================================

  function isInCoverWindow(){
    var day = new Date().getDate();
    return day >= COVER_CONFIG.START_DAY || day <= COVER_CONFIG.END_DAY;
  }

  function initCover(){
    if (!COVER_CONFIG.ENABLED) return;
    if (window.__vinhIsStatsFeatureEnabled && !window.__vinhIsStatsFeatureEnabled()) return;
    if (!isInCoverWindow()) return;
    if (COVER_CONFIG.SHOW_ONCE_PER_SESSION && sessionStorage.getItem(COVER_SESSION_KEY)) return;

    var overlay = document.getElementById('statsCoverOverlay');
    var quick = document.getElementById('coverQuickStats');
    if (!overlay) return;

    var stats = computeStats(currentMonthKey());
    if (quick) {
      quick.innerHTML =
        '<div class="cover-quick-item"><div class="cover-quick-num">' + stats.totalPosted + '</div><div class="cover-quick-label">bài đăng</div></div>' +
        '<div class="cover-quick-item"><div class="cover-quick-num">' + Object.keys(stats.byChannel).length + '</div><div class="cover-quick-label">kênh</div></div>' +
        '<div class="cover-quick-item"><div class="cover-quick-num">' + Object.keys(stats.byBrand).length + '</div><div class="cover-quick-label">thương hiệu</div></div>' +
        '<div class="cover-quick-item"><div class="cover-quick-num">' + Object.keys(stats.byAssignee).length + '</div><div class="cover-quick-label">người đăng</div></div>';
    }

    overlay.classList.add('open');
    if (COVER_CONFIG.SHOW_ONCE_PER_SESSION) sessionStorage.setItem(COVER_SESSION_KEY, '1');

    setTimeout(function(){
      overlay.classList.add('closing');
      setTimeout(function(){
        overlay.classList.remove('open');
        overlay.classList.remove('closing');
        if (window.__vinhShowStatsView) window.__vinhShowStatsView(currentMonthKey());
      }, 480);
    }, COVER_CONFIG.DISPLAY_SECONDS * 1000);
  }

  setTimeout(initCover, 700);
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function(){
  // ==========================================================================
  // 📊 Xuất Excel: sao lưu toàn bộ Content Planner (Content + Công việc nhóm +
  // Trade Marketing) thành 1 file .xlsx nhiều sheet để lưu trữ dự phòng.
  // Đây là bản sao lưu để XEM/ĐỐI CHIẾU; muốn khôi phục đầy đủ (giữ nguyên
  // định dạng chữ trong nội dung) vẫn nên dùng "⬇ Export JSON" / "⬆ Import JSON".
  // ==========================================================================
  var CONTENT_KEY = 'content_planner_data_v1';
  var TASKS_KEY = 'content_planner_tasks_v1';
  var TRADE_KEY = 'content_planner_trade_events_v1';

  function readJSON(key){
    try {
      var raw = localStorage.getItem(key);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }

  function stripHtml(html){
    var tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    return tmp.textContent || tmp.innerText || '';
  }

  function ddmmyyyy(iso){
    if (!iso) return '';
    var parts = String(iso).split('-');
    if (parts.length !== 3) return iso;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function buildContentRows(){
    return readJSON(CONTENT_KEY).map(function(item){
      return {
        'ID': item.id || '',
        'Tuần': item.week || '',
        'Ngày đăng': ddmmyyyy(item.date),
        'Nội dung (tóm tắt)': item.content || stripHtml(item.bodyHtml).slice(0, 180),
        'Nội dung đầy đủ (HTML)': item.bodyHtml || '',
        'Thương hiệu': item.brand || '',
        'Định dạng': item.format || '',
        'Pillar': item.pillar || '',
        'Trạng thái': item.status || '',
        'Danh mục sản phẩm': item.product || '',
        'CTA': item.cta || '',
        'Kênh': Array.isArray(item.channels) ? item.channels.join(', ') : '',
        'Người phụ trách': item.assignee || '',
        'Deadline': ddmmyyyy(item.deadline),
        'Link': item.link || '',
        'Thumbnail': item.thumb || ''
      };
    });
  }

  function buildTaskRows(){
    return readJSON(TASKS_KEY).map(function(item){
      return {
        'ID': item.id || '',
        'Tên công việc': item.name || '',
        'Tiến độ': item.progress || '',
        'Mô tả': item.description || '',
        'Vấn đề': item.issue || '',
        'Giải pháp': item.solution || ''
      };
    });
  }

  function buildTradeRows(){
    return readJSON(TRADE_KEY).map(function(item){
      return {
        'ID': item.id || '',
        'Tên sự kiện': item.name || '',
        'Đơn vị tổ chức': item.organizer || '',
        'Nơi tổ chức': item.venue || '',
        'Ngày tổ chức': ddmmyyyy(item.date),
        'Đối tượng tham dự': item.audience || '',
        'Mô tả': item.description || '',
        'Liên kết': Array.isArray(item.links) ? item.links.join(', ') : '',
        'Ngân sách': item.budget || '',
        'Hoạt động': Array.isArray(item.activities) ? item.activities.join(', ') : '',
        'Trạng thái': item.status || '',
        'Ngày tạo': item.createdAt || ''
      };
    });
  }

  function exportExcel(){
    try {
      if (typeof XLSX === 'undefined') {
        alert('Không tải được thư viện xuất Excel (XLSX). Vui lòng kiểm tra kết nối mạng rồi thử lại — nếu vẫn không được, mạng có thể đang chặn CDN "cdn.jsdelivr.net".');
        return;
      }
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildContentRows()), 'Content');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildTaskRows()), 'Cong viec nhom');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildTradeRows()), 'Trade Marketing');

      // Tự tay tạo Blob rồi trigger download thủ công (thay vì dùng XLSX.writeFile
      // nội bộ) — cách này minh bạch, dễ bắt lỗi, và đã được dùng ổn định ở tính
      // năng "Xuất SVG/PNG" của Event Layout Planner trong cùng file này.
      var wbArray = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
      var blob = new Blob([wbArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = 'content-planner-backup-' + new Date().toISOString().slice(0, 10) + '.xlsx';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    } catch (err) {
      console.error('[Kafka X] Lỗi xuất Excel:', err);
      alert('Xuất Excel thất bại: ' + (err && err.message ? err.message : String(err)) + '\n\nVui lòng chụp lại thông báo này và báo lại để được hỗ trợ debug.');
    }
  }

  var excelBtn = document.getElementById('exportExcelBtn');
  if (excelBtn) excelBtn.addEventListener('click', exportExcel);
})();
</script>

<script>
(function(){
  // ==========================================================================
  // 1) Bắt buộc chọn "Ngày đăng" trước khi lưu content.
  // 2) Nếu để trống "Tuần", tự động gắn tuần dựa theo ngày đăng
  //    (ngày 1-7 → Tuần 1, 8-14 → Tuần 2, 15-21 → Tuần 3, 22-28 → Tuần 4,
  //    29-31 → Tuần 5), để không còn content nào rơi vào "(Chưa gắn tuần)"
  //    một cách vô tình.
  // Cách làm: gắn listener ở PHA CAPTURE trên document, chạy trước handler
  // submit gốc của form (vốn nằm ở pha "tại đích"), nhờ đó có thể chặn submit
  // (nếu thiếu ngày) hoặc tự điền Tuần trước khi handler gốc đọc giá trị.
  // ==========================================================================

  var WEEK_LABELS = ['Tuần 1', 'Tuần 2', 'Tuần 3', 'Tuần 4', 'Tuần 5'];

  function computeWeekFromDdMmYyyy(value){
    var m = String(value || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    var day = parseInt(m[1], 10);
    var idx = Math.min(4, Math.max(0, Math.floor((day - 1) / 7)));
    return WEEK_LABELS[idx];
  }

  document.addEventListener('submit', function(e){
    if (!e.target || e.target.id !== 'cardForm') return;

    var dateInput = document.getElementById('fDate');
    var weekInput = document.getElementById('fWeek');
    var dateValue = dateInput ? dateInput.value.trim() : '';

    if (!dateValue) {
      e.preventDefault();
      e.stopImmediatePropagation();
      alert('Vui lòng chọn Ngày đăng trước khi lưu content. Đây là trường bắt buộc.');
      if (dateInput) dateInput.focus();
      return;
    }

    // Tự động gắn tuần theo ngày đăng nếu người dùng chưa chọn tuần.
    if (weekInput && !weekInput.value.trim()) {
      var autoWeek = computeWeekFromDdMmYyyy(dateValue);
      if (autoWeek) weekInput.value = autoWeek;
    }
  }, true);

  // Gợi ý tuần ngay khi người dùng chọn ngày, để họ thấy trước kết quả tự động
  // gắn tuần (vẫn có thể tự tay đổi lại nếu muốn tuần khác).
  document.addEventListener('input', function(e){
    if (!e.target || e.target.id !== 'fDate') return;
    var weekInput = document.getElementById('fWeek');
    if (!weekInput || weekInput.value.trim()) return;
    var autoWeek = computeWeekFromDdMmYyyy(e.target.value);
    if (autoWeek) weekInput.value = autoWeek;
  });

  // Đánh dấu (*) cho nhãn "Ngày đăng" để người dùng biết đây là trường bắt buộc.
  document.querySelectorAll('label').forEach(function(label){
    if (label.textContent.trim() === 'Ngày đăng' && !label.querySelector('.required-star')) {
      var star = document.createElement('span');
      star.className = 'required-star';
      star.style.color = '#d64545';
      star.textContent = ' *';
      label.appendChild(star);
    }
  });
})();
</script>
